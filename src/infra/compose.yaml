services:
  database:
    container_name: "rinha_database"
    image: "postgres:16.0-alpine3.18"
    environment:
      POSTGRES_DB: rinha
      POSTGRES_USER: rinha
      POSTGRES_PASSWORD: rinha
    ports:
      - 5432:5432
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinha -d rinha"]
      interval: 2s
      timeout: 2s
      retries: 10

  api1:
    container_name: "rinha_api1"
    build:
      context: ../..
      dockerfile: src/infra/dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: rinha
      DATABASE_USER: rinha
      DATABASE_PASSWORD: rinha

  api2:
    container_name: "rinha_api2"
    build:
      context: ../..
      dockerfile: src/infra/dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: rinha
      DATABASE_USER: rinha
      DATABASE_PASSWORD: rinha

  nginx:
    container_name: "rinha_nginx"
    image: "nginx:alpine"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
